name = "bullcom"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 静的エクスポートの出力フォルダ（Workerから env.ASSETS で参照）
[assets]
directory = "./out"
binding = "ASSETS"
# Workerを先に通すのは、ページ（HTML）とフォーム送信だけにする。
# - Workerが必要なのは、正規URLへの301（http・www・末尾スラッシュ）、/r の転送、
#   /api/contact-submit のPOST（アセット側が先に応答するとPOSTがWorkerに届かない）。
# - フォント・JS・CSS・先読み用の .txt・画像は Worker を通さず直接返す。
#   Workerを通したリクエストは無料枠（アカウント全体で1日10万件）に数えられ、
#   上限を超えると429になる。2026-10 の調査で、Workerの実行の約8割が
#   これらの静的ファイルだった（特にフォント woff2 が54%）。
# - 存在しない .php や /wp-* を探すスキャンも、Workerを通さず404を返す。
# パターンの「*」は深い階層までマッチし、「!」付きが優先される（wrangler dev で確認済み）。
run_worker_first = [
  "/*",
  "!/_next/*",
  "!/*.txt",
  "!/*.xml",
  "!/*.woff2",
  "!/*.css",
  "!/*.js",
  "!/*.png",
  "!/*.jpg",
  "!/*.jpeg",
  "!/*.webp",
  "!/*.svg",
  "!/*.ico",
  "!/*.gif",
  "!/blog-thumbnails/*",
  "!/illustrations/*",
  "!/*.php",
  "!/wp-*",
]
