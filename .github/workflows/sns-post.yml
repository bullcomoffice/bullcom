name: SNS Auto Post

on:
  repository_dispatch:
    types: [microcms-publish]
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # 投稿済み記事IDを実行間で引き継ぐ。
      # scripts/.last-posted-* は .gitignore 対象で、CIは毎回まっさらな
      # チェックアウトになるため、そのままでは重複防止がまったく効かない。
      # 2026-09-21、記事本文を編集しただけで webhook が再発火し、同じ記事が
      # IG・FB・GBP に二重投稿された。その再発防止。
      # キャッシュキーは同一キーだと上書きできないので、run_id で毎回新規作成し
      # restore-keys で直前のものを復元する（よくある write-through パターン）。
      - name: Restore last-posted state
        uses: actions/cache/restore@v4
        with:
          path: |
            scripts/.last-posted-id
            scripts/.last-posted-ig-id
            scripts/.last-posted-gbp-id
          key: sns-last-posted-${{ github.run_id }}
          restore-keys: |
            sns-last-posted-

      - name: Trigger Cloudflare rebuild (safety double-fire)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL not set, skipping"
            exit 0
          fi
          echo "Triggering Cloudflare deploy hook..."
          RESPONSE=$(curl -s -X POST "$DEPLOY_HOOK_URL")
          echo "Response: $RESPONSE"

      - name: Post to X (Twitter)
        # 2026-05-26 自動投稿停止（X API課金化に伴い手動運用に切替）
        # 手動投稿スケジュール: blog_check/bullcom_jp_x_schedule.md
        if: ${{ false }}
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SNS_HASHTAGS: ${{ secrets.SNS_HASHTAGS }}
          SNS_POST_MAX_MINUTES: ${{ secrets.SNS_POST_MAX_MINUTES }}
        run: node scripts/post-to-x.cjs

      - name: Post to Instagram & Facebook
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SNS_HASHTAGS_IG: ${{ secrets.SNS_HASHTAGS_IG }}
          SNS_POST_MAX_MINUTES: ${{ secrets.SNS_POST_MAX_MINUTES }}
        run: node scripts/post-to-instagram.cjs

      - name: Post to Google Business Profile
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SNS_POST_MAX_MINUTES: ${{ secrets.SNS_POST_MAX_MINUTES }}
        run: node scripts/post-to-gbp.cjs

      # 投稿の成否にかかわらず保存する。途中で失敗しても、
      # 次の実行で同じ記事を投稿し直さないことを優先する。
      - name: Save last-posted state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            scripts/.last-posted-id
            scripts/.last-posted-ig-id
            scripts/.last-posted-gbp-id
          key: sns-last-posted-${{ github.run_id }}
